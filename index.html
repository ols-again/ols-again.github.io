<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Portfolyo</title>
    <style>
        /* Modern & Minimalist Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid #2A2A2A;
            padding-bottom: 1.5rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        /* Projects Section */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #888888;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .projects-grid {
            margin-bottom: 4rem;
        }

        .project-card {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            border-color: #444444;
            transform: translateY(-2px);
        }

        .project-card h3 {
            color: #FFFFFF;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .project-card p {
            color: #A0A0A0;
            font-size: 0.95rem;
        }

        /* Comments (Kreosus) Section */
        #comments {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 8px;
            padding: 1.5rem;
        }

        #comments h2 {
            font-size: 1.25rem;
            color: #FFFFFF;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* Kreosus Iframe için minimum yükseklik (Arayüz kaymalarını önler) */
        #kreosus {
            min-height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <header>
            <h1>Projenin Adı / Portfolyo</h1>
        </header>

        <!-- Projeler Alanı -->
        <main>
            <h2 class="section-title">Projeler</h2>
            <div class="projects-grid">
                <!-- JSPLAY Kartı -->
                <div class="project-card">
                    <h3>JSPLAY</h3>
                    <p>HLS (M3U8) desteği ve Blob tabanlı URL maskeleme özelliğine sahip, minimalist tam ekran video oynatıcı projesi.</p>
                </div>
            </div>
        </main>

        <!-- Yorumlar & Kreosus Alanı -->
        <section id="comments">
            <h2>Yorumlar</h2>
            <div id="kreosus" data-id="4991"></div>
        </section>

    </div>

    <!-- Kreosus API Script (Optimize Edilmiş ve Asenkron) -->
    <script>
        (function(d, s, id) {
            var js, kjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s);
            js.id = id;
            js.async = true; /* Sayfa yüklenmesini engellememesi için asenkron yapıldı */
            js.src = 'https://kreosus.com/public/iframe/js/iframe-api.js';
            kjs.parentNode.insertBefore(js, kjs);
        }(document, 'script', 'kreosus-iframe-api'));
    </script>

</body>
</html>
