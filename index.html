<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLS-AGAIN Web Site</title>
    <style>
        /* Modern & Minimalist Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header & Dil Seçici */
        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid #2A2A2A;
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            transition: color 0.2s ease;
        }

        .lang-btn.active {
            color: #FFFFFF;
            border-bottom: 2px solid #FFFFFF;
        }

        /* Projects Section */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #888888;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .projects-grid {
            margin-bottom: 4rem;
        }

        .project-card {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            border-color: #444444;
            transform: translateY(-2px);
        }

        .project-card h3 {
            color: #FFFFFF;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .project-card p {
            color: #A0A0A0;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* View Link Button */
        .view-link {
            display: inline-flex;
            align-items: center;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            background-color: #2A2A2A;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .view-link:hover {
            background-color: #3A3A3A;
        }

        /* Comments (Kreosus) Section */
        #comments {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 8px;
            padding: 1.5rem;
        }

        #comments h2 {
            font-size: 1.25rem;
            color: #FFFFFF;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        #kreosus {
            min-height: 300px;
            width: 100%;
        }

        /* Dil Gizleme Sınıfı */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header & Language Switcher -->
        <header>
            <h1>OLS-AGAIN</h1>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="switchLang('tr')">TR</button>
                <button class="lang-btn" onclick="switchLang('en')">EN</button>
            </div>
        </header>

        <!-- Projeler Alanı -->
        <main>
            <!-- Türkçe İçerik -->
            <div id="content-tr" class="lang-content">
                <h2 class="section-title">Projeler</h2>
                <div class="projects-grid">
                    <div class="project-card">
                        <h3>JSPLAY</h3>
                        <p>HLS (M3U8) desteğine sahip, minimalist tam ekran video oynatıcı projesi.</p>
                        <a href="https://ols-again.github.io/jsplay/index.html" class="view-link" target="_blank">Projeyi Görüntüle →</a>
                    </div>
                </div>
            </div>

            <!-- İngilizce İçerik -->
            <div id="content-en" class="lang-content hidden">
                <h2 class="section-title">Projects</h2>
                <div class="projects-grid">
                    <div class="project-card">
                        <h3>JSPLAY</h3>
                        <p>A minimalist full-screen video player project with HLS (M3U8) support.</p>
                        <a href="https://ols-again.github.io/jsplay/index.html" class="view-link" target="_blank">View Project →</a>
                    </div>
                </div>
            </div>
        </main>

        <!-- Yorumlar & Kreosus Alanı -->
        <section id="comments">
            <h2 id="comments-title">Yorumlar</h2>
            <div id="kreosus" data-id="4991"></div>
        </section>

    </div>

    <!-- Dil Değiştirme Mantığı -->
    <script>
        function switchLang(lang) {
            // Aktif buton görselini güncelle
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // HTML lang niteliğini değiştir
            document.documentElement.lang = lang;

            // İçerikleri gizle/göster
            if (lang === 'tr') {
                document.getElementById('content-tr').classList.remove('hidden');
                document.getElementById('content-en').classList.add('hidden');
                document.getElementById('comments-title').innerText = 'Yorumlar';
            } else {
                document.getElementById('content-en').classList.remove('hidden');
                document.getElementById('content-tr').classList.add('hidden');
                document.getElementById('comments-title').innerText = 'Comments';
            }
        }
    </script>

    <!-- Kreosus API Script -->
    <script>
        (function(d, s, id) {
            var js, kjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s);
            js.id = id;
            js.async = true;
            js.src = 'https://kreosus.com/public/iframe/js/iframe-api.js';
            kjs.parentNode.insertBefore(js, kjs);
        }(document, 'script', 'kreosus-iframe-api'));
    </script>

</body>
</html>
