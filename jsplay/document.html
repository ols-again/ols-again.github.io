<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>JSPLAY Kullanım Belgesi</title>
<!-- Marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Highlight.js (kod blokları için) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/monokai.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #0a0a0a; /* Siyah arkaplan */
    color: #00e5ff; /* Turkuaz metin */
    padding: 30px;
    line-height: 1.6;
  }
  h1, h2, h3 {
    color: #00ffe0; /* Başlıklar Turkuaz */
  }
  p, li {
    color: #00e5ff;
  }
  a {
    color: #ffd700; /* Sarı linkler */
    text-decoration: underline;
  }
  code {
    background-color: #111; /* Kod arkaplanı koyu */
    color: #ffd700;       /* Sarı kod metni */
    padding: 2px 5px;
    border-radius: 4px;
    font-family: monospace;
  }
  pre {
    background-color: #111; /* Siyah kod blokları */
    color: #ffd700;         /* Sarı kod */
    padding: 15px;
    overflow-x: auto;
    border-radius: 6px;
  }
  blockquote {
    border-left: 4px solid #00ffe0;
    padding-left: 10px;
    color: #a0f0ff;
    font-style: italic;
  }
  ul, ol {
    margin-left: 20px;
  }
  hr {
    border: 1px solid #00ffe0;
  }
</style>
</head>
<body>
<div id="doc"></div>

<script>
fetch('jsplay.md')
  .then(res => res.text())
  .then(md => {
    document.getElementById('doc').innerHTML = marked.parse(md);
    hljs.highlightAll(); // Kod bloklarını renklendir
  })
  .catch(err => {
    document.getElementById('doc').innerHTML = '<p>Markdown belgesi yüklenemedi.</p>';
    console.error(err);
  });
</script>

</body>
</html>
